  <link rel="stylesheet" href="vendor/gridstack@10.3.1/gridstack.min.css">
  <link rel="stylesheet" href="vendor/maplibre-gl@5.24.1/maplibre-gl.css">
  <link rel="stylesheet" href="css/app.css">
  <!-- The chart, map, grid and globe libraries are not loaded here: js/core/libs.js loads each one when a view needs
       it (a phone's first screen needs none) and, on desktop, all of them once the page is idle. -->
</head>
<body>
  <a class="shell-skip" href="#views" data-skip>Skip to content</a>
  <header class="topbar">
    <a class="brand" href="#watch" title="Night Desk: go to Watch" aria-label="Night Desk: go to Watch">
      <svg viewBox="0 0 32 32" class="brand-mark" aria-hidden="true"><title>Take the tour of this page</title><rect class="bm-emit" x="11" y="4" width="10" height="3" rx="1.5"/><path class="bm-beam" d="M12 7 H20 L25 23 H7 Z"/><path class="bm-edge" d="M12 7 H20 L25 23 H7 Z"/><path class="bm-desk" d="M6 23 H26"/><circle class="bm-dot" cx="16" cy="19" r="2.3"/></svg>
      <span class="brand-name">Night Desk</span><span class="brand-tag">LOCAL</span>
    </a>
    <!-- Main navigation: routes, not tabs (aria-current marks the view on screen). Phones use the bottom bar below. -->
    <nav class="views" aria-label="Main">
      <button data-view="watch" class="active" aria-current="page">Watch</button>
      <button data-view="network">Network</button>
      <button data-view="news">News</button>
      <button data-view="entities">Intel</button>
      <button data-view="ops">Ops</button>
      <button data-view="cinema" class="shell-desk-only">Cinema</button>
    </nav>
    <div class="gs" id="gs">
      <button class="gs-open icon-btn" id="gs-open" title="Search everything (/)" aria-label="Search"><svg class="i"><use href="#i-search"/></svg></button>
      <div class="gs-box" role="combobox" aria-label="Search everything" aria-haspopup="listbox" aria-owns="gs-list" aria-expanded="false">
        <svg class="i"><use href="#i-search"/></svg>
        <input id="global-search" placeholder="Search everything…" autocomplete="off" spellcheck="false" aria-label="Search everything" aria-autocomplete="list" aria-controls="gs-list">
        <span class="gs-mode mono" hidden></span>
        <kbd class="gs-kbd mono">/</kbd>
        <button class="gs-x icon-btn" title="Close" aria-label="Close search"><svg class="i"><use href="#i-x"/></svg></button>
      </div>
      <div class="gs-drop" id="gs-list" role="listbox" hidden></div>
    </div>
    <div class="top-right">
      <a class="al-badge" id="al-badge" href="#network/alerts" title="Open network alerts" hidden><span class="al-l">Alerts</span><span class="al-sev"></span></a>
      <a class="shell-feed" id="feed-dot" href="#settings/sources" data-ls="waiting" title="Source health" aria-label="Source health: checking"><span class="shell-feed-dot" aria-hidden="true"></span><span class="shell-feed-t">Sources</span></a>
      <div class="clock" id="clock" aria-hidden="true">--:--:--</div>
      <div class="shell-pop" id="gear">

        <div class="menu shell-menu" id="gear-menu" role="menu" aria-label="Settings and tools">

  <!-- Stale-code check (okf/architecture/web-client.md#updates). This page is always revalidated, so it is current;
       the scripts may be older copies the browser kept, from a server that did not yet send no-cache. A current main.js
       sets window.ndMain at once; if none did by the time the page has loaded, offer the way out. Self-contained
       (inline styles, no other file), because app.css and every module may be the old copies. Inline on purpose:
       the server's Content-Security-Policy allows it by its sha256 hash, computed from this file (api.py csp()). -->
  <script>
  (function () {
    var cookie = 'nd_build' + (location.port ? '_' + location.port : '');
    // re-fetch every file this page loaded past the cache (works on any origin), forget the build cookie, reload
    window.ndClearAndReload = function () {
      var urls = performance.getEntriesByType('resource').map(function (e) { return e.name; })
        .filter(function (u) { return u.indexOf(location.origin) === 0 && u.indexOf('/api/') < 0; });
      urls.push(new URL('js/main.js', document.baseURI).href, new URL('js/core/shell.js', document.baseURI).href,
        new URL('css/app.css', document.baseURI).href);
      var done = Promise.all(urls.map(function (u) { return fetch(u, { cache: 'reload' }).catch(function () {}); }));
      Promise.race([done, new Promise(function (r) { setTimeout(r, 4000); })]).then(function () {
        document.cookie = cookie + '=; Max-Age=0; Path=/; SameSite=Strict';
        location.reload();
      });
    };
    window.addEventListener('load', function () {
      setTimeout(function () {
        if (window.ndMain === 1 || document.getElementById('nd-stale')) return;
        var d = document.createElement('div');
        d.id = 'nd-stale'; d.setAttribute('role', 'alert');
        d.style.cssText = 'position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(10,13,18,.94);color:#e9e3d4;font:14px/1.5 Inter,system-ui,sans-serif;text-align:center';
        d.innerHTML = '<div style="max-width:420px"><p style="font:600 22px/1.3 Fraunces,Georgia,serif;margin:0 0 10px">Night Desk didn\'t load</p>'
          + '<p style="color:#b7b1a2;margin:0 0 18px">Part of the app is an older copy your browser kept.</p>'
          + '<button type="button" style="min-height:44px;padding:0 16px;border-radius:5px;border:1px solid #e4a84c;background:#e4a84c;color:#1a1408;font:500 13px/1 ui-monospace,Menlo,monospace;cursor:pointer">Clear cached files and reload</button></div>';
        document.body.appendChild(d);
        var b = d.querySelector('button');
        b.addEventListener('click', function () { b.disabled = true; b.textContent = 'Clearing…'; window.ndClearAndReload(); });
        b.focus();
      }, 400);
    });
  })();
  </script>
  <!-- Pages and Back (Back/Forward move between URL pages; overlays close with ×/Esc), scroll per entry and the phone

  <script type="module" src="js/core/preload.js"></script>
