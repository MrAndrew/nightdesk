[project]
# The installable package is "nightdesk" (the `nightdesk` command); the Python module stays `osinthub`.
name = "nightdesk"
version = "0.1.0"
description = "Night Desk: a local cyber OSINT hub (FastAPI + DuckDB + web client)"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.14"
dependencies = [
    "certifi>=2026.10.23",
    "cryptography>=44",
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "feedparser>=6.0.14",
    "httpx>=0.28.1",
    "maxminddb>=3.2.0",
    "numpy>=2.5.4",
    "python-multipart>=0.0.33",
    "pytz>=2026.6",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
    "websockets>=17.4",
]

[project.scripts]
nightdesk = "osinthub.__main__:cli"
nightdesk-redact = "osinthub.redact:cli"

[build-system]
# Build-time only (uv fetches it to build the wheel); nothing here is installed with Night Desk.
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["osinthub"]
exclude = ["__pycache__", "*.pyc"]

[tool.hatch.build.targets.wheel.force-include]
# The web client and the docs bundle sit at the repo root; an installed copy carries them inside the package
# (osinthub/config.py looks there first).
"web" = "osinthub/web"
"okf" = "osinthub/okf"

[tool.hatch.build.targets.sdist]
include = ["osinthub", "web", "okf", "README.md", "LICENSE", "NOTICE", "SECURITY.md", "pyproject.toml", "uv.lock"]
exclude = ["__pycache__", "*.pyc"]

[tool.uv]
# The local AI helper (osinthub/ai/server.py) needs MLX; the marker makes this a no-op on Linux/Docker. A dependency
# group is for working in this repo only: an installed `nightdesk` never gets it (local AI is an optional download).
default-groups = ["mlx"]

[dependency-groups]
mlx = [
    "mlx-lm>=0.32.2 ; sys_platform == 'darwin'",
]

# Lint only (run with `uvx ruff check osinthub tests tools`; ruff is not a dependency). The house style is dense
# 120-column code with one-line statements, so the formatter and the pure style rules are not used.
[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E402", "E9", "F", "B", "UP", "PLE", "RUF100"]
# noqa comments for rules other linters check (lambdas, broad excepts) are kept
external = ["E731", "BLE001"]
# B008: FastAPI's Query()/Depends() defaults; B904/B905: deliberate here (HTTP errors, zips of equal-length lists)
ignore = ["B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
# hand-run eval and critic scripts (tests/eval/README.md): lint for faults only
"tests/eval/**" = ["B007", "E402", "F841", "UP031"]
