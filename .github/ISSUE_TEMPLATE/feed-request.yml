name: Feed request
description: Suggest a public threat feed or data source to add.
labels: ["feed request"]
body:
  - type: markdown
    attributes:
      value: |
        **Please keep your own network out of this issue.** Don't paste your logs, IP or MAC addresses, device names, host names or screenshots of your dashboard: issues are public. A made-up example is enough. **Settings › About › Copy diagnostics** gives a summary with those removed, and `nightdesk-redact` makes a log sample safe to share.

        Security problems go privately, not here: see SECURITY.md.
  - type: input
    id: name
    attributes:
      label: Feed
      placeholder: "Example Threat List"
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Where it is published
      description: The page that describes it, or the download address.
    validations:
      required: true
  - type: input
    id: terms
    attributes:
      label: Its terms or licence
      description: A link to the terms of use, if you know them. Night Desk only adds feeds whose terms allow it.
  - type: textarea
    id: why
    attributes:
      label: What it would add
      description: What it lists (addresses, domains, vulnerabilities …), how often it updates, and why it's useful.
