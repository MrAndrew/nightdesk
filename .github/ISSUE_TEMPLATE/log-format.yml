name: Log format request
description: Ask for a log format Night Desk can't read yet (a firewall, router, DNS resolver, IDS …).
labels: ["log format"]
body:
  - type: markdown
    attributes:
      value: |
        **Please keep your own network out of this issue.** Don't paste your logs, IP or MAC addresses, device names, host names or screenshots of your dashboard: issues are public. A made-up example is enough. **Settings › About › Copy diagnostics** gives a summary with those removed, and `nightdesk-redact` makes a log sample safe to share.

        Security problems go privately, not here: see SECURITY.md.
  - type: input
    id: product
    attributes:
      label: What writes the logs
      placeholder: "Example Router OS 7.2, DNS query log"
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: A short sample
      description: |
        Ten or twenty lines are enough. Make it safe first: run it through `nightdesk-redact` (or `uv run python -m osinthub.redact` in the source folder), which replaces addresses, MACs and names consistently, then read the result: user names, file paths, free text, device names without a dot and encoded fields are not changed. Or write a made-up sample in the same format.
      render: text
    validations:
      required: true
  - type: textarea
    id: where
    attributes:
      label: How you get the logs
      description: Where the device keeps them or how it sends them (a file, syslog, an API), and a link to its documentation if there is one.
